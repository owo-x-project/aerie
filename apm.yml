name: aerie-workspace-harness
version: 0.1.0
description: Shared AI workspace harness for project-local work and cognition
author: owo
license: MIT
includes: auto

# Keep deployment explicit so the same APM manifest serves both supported
# agent CLIs and the cross-client Agent Skills directory.
targets:
  - codex
  - claude
  - agent-skills

dependencies:
  # The Owlspec skill is pinned to the same release the Nix dev shell provides.
  # Bump both together; the skill defers to the installed binary on conflict.
  apm:
    - git: https://github.com/owo-x-project/owlspec.git
      path: .apm/skills/owlspec
      ref: v0.2.0
  mcp:
    - name: lean-ctx
      registry: false
      transport: stdio
      # MCP clients start before PreToolUse hooks can enter the dev shell.
      # Enter the pinned shell explicitly so this server is available even
      # when Codex or Claude was launched outside `nix develop`.
      command: nix
      args:
        - develop
        - --no-write-lock-file
        - path:.
        - --command
        - lean-ctx
      env:
        LEAN_CTX_HEADLESS: "1"
        LEAN_CTX_RULES_INJECTION: dedicated

scripts: {}
