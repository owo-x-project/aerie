# LeanCTX is a cognition layer, not an AI-configuration owner.
rules_injection = "dedicated"

# The shell allowlist does not know the Truth layer's binary, so LeanCTX blocks
# every `owlspec` call routed through it. This declaration is the shared record
# of that policy, but it does not carry it on its own: the key is
# security-sensitive, so LeanCTX withholds it until an operator runs
# `lean-ctx trust` here, and trust is scoped to this directory while Projects
# are where owlspec actually runs. The dev shell therefore also writes the same
# entry into the never-trust-gated data-dir config on entry.
shell_allowlist_extra = ["owlspec"]

[setup]
auto_inject_rules = false
auto_inject_skills = false
auto_update_mcp = false

[boundary_policy]
audit_cross_access = true
cross_project_search = false
cross_project_import = false

# Canonical and work-state responses must reach the agent unaltered. Compressing
# them would let a derived layer change what Owlspec and Beads actually said.
# The first four entries are the upstream defaults, preserved because setting
# this key replaces the list rather than extending it.
[archive]
raw_commands = ["sqlite3", "psql", "duckdb", "jq", "owlspec", "bd"]

# Canonical records are never read in bulk, but an incidental read must not be
# lossy either.
[proxy]
compress_protect = [".owlspec/**"]
