# 大きすぎるファイルの上限
#
# 書き方  対象の形  上限  単位
#   上から順に見て、最初に合った行を使う
#   単位は tokens か lines
#   上限が - のものは調べない
#   プロジェクトごとに変えるときは .aerie/tokens.conf に同じ形で置く

# 調べないもの
*.png            -
*.jpg            -
*.jpeg           -
*.gif            -
*.webp           -
*.ico            -
*.pdf            -
*.zip            -
*.woff           -
*.woff2          -
*.min.js         -
*.min.css        -
*.lock           -
*-lock.json      -

# いつも読まれる指示
CLAUDE.md        1500   tokens
AGENTS.md        1500   tokens
SKILL.md         2000   tokens
*/SKILL.md       2000   tokens
*/AGENTS.md      1500   tokens

# 文書
README.md        4000   tokens
docs/*.md        8000   tokens
*.md             6000   tokens

# 設定
*.json           4000   tokens
*.yml            2000   tokens
*.yaml           2000   tokens
*.toml           2000   tokens

# それ以外
*                700    lines
